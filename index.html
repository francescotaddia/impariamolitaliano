<style>

:root{
  --bg: #FFF6E9;
  --bg-card: #FFFFFF;
  --ink: #331E5C;
  --ink-soft: #6B5B95;
  --primary: #FF6F5E;
  --primary-deep: #E5493A;
  --secondary: #3DA9FC;
  --yellow: #FFC93C;
  --green: #4FBE7A;
  --purple: #A66CFF;
  --pink: #FF8FC7;
  --focus-ring: #FFC93C;
  --shadow: 0 10px 0 rgba(51,30,92,0.12);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background: var(--bg);
  background-image:
    radial-gradient(circle at 8% 12%, rgba(255,201,60,0.35) 0, transparent 40%),
    radial-gradient(circle at 92% 88%, rgba(61,169,252,0.25) 0, transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(166,108,255,0.2) 0, transparent 40%);
  color: var(--ink);
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
  -webkit-user-select:none; user-select:none;
}
#app{
  width:100vw; height:100vh;
  padding: 4.5vh 4.5vw;
  display:flex; flex-direction:column;
  position:relative;
}
h1,h2,h3{
  font-family:'Baloo 2', sans-serif;
  margin:0;
  text-wrap: balance;
}
.eyebrow{
  font-family:'Nunito';
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  color: var(--ink-soft);
  font-size: 1.1vw;
}
button{ font-family:inherit; }
.lang-ar, .lang-ar h1, .lang-ar h2, .lang-ar h3, .lang-ar button, .lang-ar input, .lang-ar div{ font-family:'Cairo', 'Nunito', sans-serif; }
[dir="rtl"] .choice-tile.sentence-tile{ text-align:start; }
.stimulus{ direction: ltr; }

/* ---------- focusable tiles ---------- */
.tile{
  border:none;
  border-radius: 28px;
  cursor:pointer;
}
[data-focusable]{
  transition: transform .12s ease, box-shadow .12s ease;
  outline:none;
}
[data-focusable]:hover, [data-focusable]:focus, [data-focusable]:focus-visible, [data-focusable].focused{
  transform: scale(1.06);
  box-shadow: 0 0 0 6px var(--focus-ring), var(--shadow);
  z-index:2;
}

/* ---------- HOME ---------- */
.home{ display:flex; flex-direction:column; height:100%; gap: 2.2vh;}
.home-top{ display:flex; justify-content:space-between; align-items:flex-start;}
.home-title{ font-size: 4.4vw; color:var(--primary-deep); line-height:1.05;}
.home-title span{ color: var(--purple);}
.home-sub{ font-size:1.5vw; color:var(--ink-soft); font-weight:700; margin-top:.5vh;}
.home-top-right{ display:flex; align-items:center; gap:1vw; }
.lang-switch{ display:flex; gap:.7vw; }
.lang-flag{
  font-size:1.7vw; background:var(--bg-card); box-shadow:var(--shadow);
  width:3.4vw; height:3.4vw; min-width:46px; min-height:46px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.lang-flag.active{ box-shadow:0 0 0 4px var(--secondary), var(--shadow); }
.settings-btn{
  background: var(--bg-card);
  width: 4.2vw; height:4.2vw; min-width:56px; min-height:56px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:2vw;
  box-shadow: var(--shadow);
}
.home-grid{
  flex:1;
  display:grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 1.6vw;
}
.cat-tile{
  background: var(--bg-card);
  box-shadow: var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.4vh;
  padding: 1vh .5vw;
  position:relative;
}
.cat-tile .emoji{ font-size: 3.4vw; }
.cat-tile .label{ font-weight:800; font-size:1.15vw; color:var(--ink); text-align:center;}
.cat-tile .stars{ font-size:.9vw; color: var(--yellow); font-weight:800;}
.home-footer{ display:flex; gap:1.4vw; }
.pill-btn{
  background: var(--secondary);
  color:white; font-weight:900; font-size:1.3vw;
  padding: 1.6vh 2vw; border-radius: 999px;
  box-shadow: var(--shadow);
  display:flex; align-items:center; gap:.6vw;
}
.pill-btn.challenge{ background: var(--pink); }
.pill-btn.challenge.active{ background: var(--green); }

/* ---------- CATEGORY / QUIZ ---------- */
.screen{ display:flex; flex-direction:column; height:100%; }
.top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2vh;}
.back-btn{
  background: var(--bg-card); box-shadow: var(--shadow);
  border-radius: 999px; padding: 1.2vh 1.6vw; font-weight:900; font-size:1.3vw;
  display:flex; align-items:center; gap:.5vw;
}
.progress-dots{ display:flex; gap:.5vw; }
.progress-dots .dot{ width:1vw; height:1vw; border-radius:50%; background:#E8E1F5; }
.progress-dots .dot.done{ background: var(--green); }
.progress-dots .dot.current{ background: var(--yellow); }
.mode-switch{ display:flex; gap:.6vw; }
.mode-pill{
  background: var(--bg-card); box-shadow: var(--shadow);
  border-radius: 999px; padding: 1vh 1.2vw; font-weight:800; font-size:1vw; color:var(--ink-soft);
}
.mode-pill.active{ background: var(--secondary); color:white; }
.mode-pill.disabled{ opacity:.4; }

.quiz-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 3vh; position:relative;}
.quiz-lang-flag{
  position:absolute; top:-2vh; right:1vw;
  font-size:5vw; line-height:1;
  filter: drop-shadow(0 6px 0 rgba(51,30,92,0.12));
  pointer-events:none;
}
.avatar-row{ display:flex; gap:3vw; align-items:center; }
.avatar{ display:flex; flex-direction:column; align-items:center; gap:.5vh; opacity:.45; transition:opacity .2s, transform .2s; }
.avatar.active{ opacity:1; transform: scale(1.12);}
.avatar .pic{ width:5.2vw; height:5.2vw; border-radius:50%; background:var(--bg-card); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:2.6vw; overflow:hidden; }
.avatar .pic img{ width:100%; height:100%; object-fit:cover; }
.avatar .name{ font-weight:900; font-size:1.05vw; }
.avatar .score{ font-size:1vw; color:var(--yellow); font-weight:800; }

.stimulus{
  font-size: 12vw;
  line-height:1;
  filter: drop-shadow(0 12px 0 rgba(51,30,92,0.08));
}
.stimulus-sentence{ font-size: 7vw; letter-spacing: .4vw; }
.stimulus-label{ font-size:1.3vw; color:var(--ink-soft); font-weight:800;}

.voice-controls{ display:flex; gap:2vw; }
.round-btn{
  background: var(--bg-card); box-shadow: var(--shadow);
  border-radius: 999px; padding: 1.6vh 2.4vw;
  font-size:1.4vw; font-weight:900; display:flex; align-items:center; gap:.7vw;
}
.round-btn.mic{ background: var(--primary); color:white; }
.round-btn.mic.listening{ animation: pulse 1s infinite; background: var(--primary-deep); }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(229,73,58,.5), var(--shadow);} 70%{box-shadow:0 0 0 22px rgba(229,73,58,0), var(--shadow);} 100%{box-shadow:0 0 0 0 rgba(229,73,58,0), var(--shadow);} }

.choice-row{ display:flex; gap:2vw; }
.choice-tile{
  background: var(--bg-card); box-shadow: var(--shadow);
  border-radius: 24px; padding: 2vh 2vw; min-width:12vw;
  display:flex; flex-direction:column; align-items:center; gap:.8vh;
  font-size:1.5vw; font-weight:800;
}
.choice-tile .emoji{ font-size:3vw; }
.choice-row-sentence{ flex-direction:column; align-items:stretch; width:56vw; gap:1.4vh; }
.choice-tile.sentence-tile{
  flex-direction:row; justify-content:flex-start; text-align:left;
  font-size:1.35vw; padding:1.8vh 2.2vw; min-width:0;
}

.hint-banner{
  position:absolute; top:-1vh;
  background: var(--yellow); color:var(--ink);
  padding: .8vh 1.6vw; border-radius:999px; font-weight:800; font-size:1.1vw;
  box-shadow: var(--shadow);
}

/* ---------- CELEBRATION ---------- */
.celebrate-overlay{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:2vh; background: rgba(255,246,233,0.92); z-index:50;
}
.celebrate-emoji{ font-size:14vw; animation: bounce .6s ease infinite alternate; }
@keyframes bounce{ from{ transform: translateY(0) rotate(-4deg);} to{ transform: translateY(-2vh) rotate(4deg);} }
.celebrate-text{ font-size:4vw; color:var(--primary-deep); font-family:'Baloo 2'; }
canvas#confetti{ position:fixed; inset:0; pointer-events:none; z-index:51;}

/* ---------- SETTINGS ---------- */
.settings-form{ display:flex; flex-direction:column; gap:2.2vh; max-width:50vw; }
.field label{ display:block; font-weight:900; margin-bottom:.6vh; font-size:1.15vw; color:var(--ink-soft); }
.field input[type=text]{
  width:100%; font-size:1.4vw; padding:1.4vh 1.2vw; border-radius:16px; border:3px solid #E8E1F5;
  font-family:'Nunito'; font-weight:700; background:var(--bg-card); color:var(--ink);
}
.field input[type=text]:focus{ outline:none; border-color: var(--focus-ring); }
.photo-row{ display:flex; gap:1.4vw; align-items:center; }
.photo-preview{ width:5vw; height:5vw; border-radius:50%; background:#E8E1F5; display:flex; align-items:center; justify-content:center; font-size:2.4vw; overflow:hidden; }
.photo-preview img{ width:100%; height:100%; object-fit:cover; }
.upload-btn{ background: var(--secondary); color:white; font-weight:900; padding:1.2vh 1.6vw; border-radius:999px; font-size:1.1vw; }
.toggle-row{ display:flex; align-items:center; gap:1vw; }
.toggle{
  width:4vw; height:2.2vw; border-radius:999px; background:#E8E1F5; position:relative; transition:background .2s;
}
.toggle.on{ background: var(--green); }
.toggle::after{ content:''; position:absolute; top:.25vw; left:.25vw; width:1.7vw; height:1.7vw; border-radius:50%; background:white; transition:left .2s; }
.toggle.on::after{ left: 2.05vw; }
.mic-status{ font-size:1vw; color:var(--ink-soft); font-weight:700; }
</style>

let allVoices = [];
function updateVoiceDebug(extra){

if(window.speechSynthesis){

function pickVoice(bcp47){
  const prefix = (bcp47 || (LANGS[L()]||LANGS.it).bcp47).split('-')[0].toLowerCase();
  const langVoices = allVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
  if(!langVoices.length) return null;
  const preferred = langVoices.find(v => /female|donna|woman|elsa|alice|paola|federica|giulia|kvinna|femme/i.test(v.name));
  return preferred || langVoices[0];
}

function speak(text, opts){
  opts = opts || {};
  try{
    if(!window.speechSynthesis){ updateVoiceDebug('speechSynthesis assente'); if(opts.onEnd) opts.onEnd(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const bcp = opts.langOverride || (LANGS[L()]||LANGS.it).bcp47;
    u.lang = bcp;
    const v = pickVoice(bcp);
    if(v) u.voice = v;
    u.rate = opts.excited ? 1.12 : (opts.teach ? 0.95 : 1.02);
    u.pitch = opts.excited ? 1.55 : (opts.teach ? 1.2 : 1.35);
    u.volume = 1;
    updateVoiceDebug('speak() chiamato con testo: "' + text + '" voce scelta: ' + (v ? v.name : 'NESSUNA (default)') + ' | click isTrusted=' + window.__lastClickTrusted + ' | speechSynthesis.speaking=' + speechSynthesis.speaking + ' pending=' + speechSynthesis.pending + ' paused=' + speechSynthesis.paused);
    u.onstart = () => updateVoiceDebug('EVENTO onstart ricevuto (sta parlando)');
    u.onend = () => updateVoiceDebug('EVENTO onend ricevuto (finito)');
    u.onerror = (ev) => updateVoiceDebug('EVENTO onerror: ' + ev.error);
    if(opts.onEnd){
      let done = false;
      const origOnEnd = u.onend, origOnError = u.onerror;
      const finish = () => { if(done) return; done = true; opts.onEnd(); };
      u.onend = (ev) => { origOnEnd(ev); finish(); };
      u.onerror = (ev) => { origOnError(ev); finish(); };
      setTimeout(finish, 3000);
    }
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){ updateVoiceDebug('ECCEZIONE: ' + e.message); if(opts.onEnd) opts.onEnd(); }
}

function normalize(s){
  return s.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9؀-ۿ ]/g, '').trim();
}

function matches(transcript, item){
  const accepted = item.accepts || [item.w];
  const t = normalize(transcript);
  const directHit = accepted.some(a => {
    const an = normalize(a);
    if(an.length <= 2) return t === an;
    return t === an || t.includes(an) || an.includes(t);
  });
  if(directHit) return true;
  if(item.keywords && item.keywords.length){
    const hits = item.keywords.filter(k => t.includes(normalize(k))).length;
    return hits >= Math.max(2, Math.ceil(item.keywords.length * 0.66));
  }
  return false;
}

function effectiveMode(){
  if(state.quizMode === 'voice') return voiceSupported ? 'voice' : 'choice';
  return 'choice';
}

function startListening(item, onDone, langOverride){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ onDone(false, 'unsupported'); return; }
  let rec;
  try{ rec = new SR(); }catch(e){ onDone(false, 'unsupported'); return; }
  rec.lang = langOverride || (LANGS[L()]||LANGS.it).bcp47;
  rec.maxAlternatives = 3;
  rec.interimResults = false;
  state.listening = true;
  render();
  let done = false;
  rec.onresult = (e) => {
    done = true;
    state.listening = false;
    const alts = Array.from(e.results[0]).map(r => r.transcript);
    const ok = alts.some(a => matches(a, item));
    onDone(ok, null);
  };
  rec.onerror = (e) => {
    if(done) return;
    done = true;
    state.listening = false;
    onDone(false, e.error);
  };
  rec.onend = () => {
    if(!done){ state.listening = false; onDone(false, 'no-speech'); }
  };
  try{ rec.start(); }catch(e){ state.listening = false; onDone(false, 'unsupported'); }
}

function burstConfetti(){
  const canvas = document.getElementById('confetti');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#FF6F5E','#FFC93C','#3DA9FC','#4FBE7A','#A66CFF','#FF8FC7'];
  const pieces = Array.from({length:120}, () => ({
    x: Math.random()*canvas.width, y: -20 - Math.random()*canvas.height*0.4,
    vx: (Math.random()-0.5)*4, vy: 3+Math.random()*5,
    size: 6+Math.random()*8, color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360, vr: (Math.random()-0.5)*10
  }));
  let frame = 0;
  function step(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    if(frame < 110) requestAnimationFrame(step);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  step();
}

function playChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + i*0.12);
      gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i*0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.12 + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i*0.12);
      osc.stop(ctx.currentTime + i*0.12 + 0.32);
    });
  }catch(e){}
}

function playSoftBlip(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.value = 330;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.25);
  }catch(e){}
}

function focusables(){
  return Array.from(document.querySelectorAll('[data-focusable]')).filter(el => el.offsetParent !== null);
}
function currentFocused(){
  const active = document.activeElement;
  if(active && active.matches && active.matches('[data-focusable]')) return active;
  return document.querySelector('[data-focusable].focused') || focusables()[0];
}
function setFocus(el){
  focusables().forEach(f => f.classList.remove('focused'));
  if(el){
    el.classList.add('focused');
    el.scrollIntoView({block:'nearest', inline:'nearest'});
    try{ el.focus({preventScroll:true}); }catch(e){ try{ el.focus(); }catch(e2){} }
  }
}
document.addEventListener('focusin', (e) => {
  const t = e.target;
  if(t && t.matches && t.matches('[data-focusable]')){
    focusables().forEach(f => { if(f !== t) f.classList.remove('focused'); });
    t.classList.add('focused');
  }
});
function moveFocus(dir){
  const all = focusables();
  if(!all.length) return;
  const cur = currentFocused();
  if(!cur){ setFocus(all[0]); return; }
  const cr = cur.getBoundingClientRect();
  const cx = cr.left + cr.width/2, cy = cr.top + cr.height/2;
  let best = null, bestScore = Infinity;
  all.forEach(el => {
    if(el === cur) return;
    const r = el.getBoundingClientRect();
    const x = r.left + r.width/2, y = r.top + r.height/2;
    const dx = x - cx, dy = y - cy;
    let primary, cross, ok;
    if(dir === 'ArrowRight'){ primary = dx; cross = dy; ok = dx > 4; }
    if(dir === 'ArrowLeft'){ primary = -dx; cross = dy; ok = dx < -4; }
    if(dir === 'ArrowDown'){ primary = dy; cross = dx; ok = dy > 4; }
    if(dir === 'ArrowUp'){ primary = -dy; cross = dx; ok = dy < -4; }
    if(!ok) return;
    const score = primary + Math.abs(cross)*1.5;
    if(score < bestScore){ bestScore = score; best = el; }
  });
  if(best) setFocus(best);
}

const KEYCODE_ARROWS = {37:'ArrowLeft', 38:'ArrowUp', 39:'ArrowRight', 40:'ArrowDown'};
let lastNavAt = 0;
window.addEventListener('keydown', (e) => {
  if(state.celebrating) return;
  const activeTag = document.activeElement && document.activeElement.tagName;
  if(activeTag === 'INPUT' || activeTag === 'TEXTAREA'){
    if(e.key === 'Escape'){ document.activeElement.blur(); }
    return;
  }
  const key = KEYCODE_ARROWS[e.keyCode] || e.key;
  const now = Date.now();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)){
    e.preventDefault();
    if(now - lastNavAt < 150) return;
    lastNavAt = now;
    moveFocus(key);
  } else if(key === 'Enter' || key === ' ' || e.keyCode === 13 || e.keyCode === 29443){
    e.preventDefault();
    const el = currentFocused();
    if(el) el.click();
  } else if(key === 'Backspace' || key === 'Escape' || key === 'GoBack' || e.keyCode === 10009 || e.keyCode === 8){
    e.preventDefault(); goBack();
  }
});

            ${activeRoster().map(who => `
              <div class="avatar ${state.turn===who?'active':''}">
                <div class="pic">${avatarPic(who)}</div>
                <div class="name">${esc(playerName(who))}</div>
                <div class="score">⭐ ${state.scores[who]}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <div class="stimulus ${isSentence ? 'stimulus-sentence' : ''}">${item.e}</div>
        <div class="stimulus-label">${esc(isSentence ? t('questionSentence') : t('questionWord'))}</div>
        ${mode === 'voice' ? `
          <div class="voice-controls">
            <button class="round-btn tile" data-focusable data-action="listen-word">🔊 ${esc(t('listen'))}</button>
            <button class="round-btn mic tile ${state.listening?'listening':''}" data-focusable data-action="try-voice">
              ${state.listening ? `👂 ${esc(t('listening'))}` : `🎤 ${esc(t('tryVoice'))}`}
            </button>
          </div>
          <div class="mic-status">${esc(isSentence ? t('micHintSentence') : t('micHintWord'))}</div>
        ` : `
          <div class="choice-row ${isSentence ? 'choice-row-sentence' : ''}">
            ${state.choiceOptions.map(opt => `
              <button class="choice-tile tile ${isSentence ? 'sentence-tile' : ''}" data-focusable data-action="choice" data-word="${esc(opt.w)}">
                ${isSentence ? '' : `<div class="emoji">${opt.e}</div>`}
                <div>${phrase(opt)}${isSentence ? '.' : ''}</div>
              </button>
            `).join('')}
          </div>
        `}
      </div>
    </div>
  `;
  wireActions();
  const preferred = document.querySelector('[data-action="try-voice"]') || document.querySelector('[data-action="choice"]');
  setFocus(preferred || focusables()[0]);
}

function nextItem(correct){
  state.answering = false;
  const cat = CATEGORIES.find(c => c.id === state.currentCategory);
  if(correct){
    state.stars[cat.id] = Math.min(cat.items.length, (state.stars[cat.id]||0) + 1);
    saveStars();
    if(state.settings.challengeMode){
      state.scores[state.turn]++;
      const roster = activeRoster();
      const idx = roster.indexOf(state.turn);
      state.turn = roster[(idx + 1) % roster.length] || 'child';
    }
  }
  state.voiceFails = 0;
  state.showChoiceFallback = false;
  state.choiceOptions = [];
  if(state.currentIndex < state.order.length - 1){
    state.currentIndex++;
    render();
  } else {
    goto('category-done');
  }
}

function celebrate(cb){
  state.celebrating = true;
  const app = document.getElementById('app');
  const praiseList = PRAISE();
  const praise = praiseList[Math.floor(Math.random()*praiseList.length)];
  const overlay = document.createElement('div');
  overlay.className = 'celebrate-overlay';
  overlay.innerHTML = `
    <div class="celebrate-emoji">🎉</div>
    <div class="celebrate-text">${praise}</div>
  `;
  document.body.appendChild(overlay);
  burstConfetti();
  playChime();
  speak(praise, {excited:true});
  setTimeout(() => {
    document.body.removeChild(overlay);
    state.celebrating = false;
    cb();
  }, 1600);
}

function renderCategoryDone(){
  const app = document.getElementById('app');
  const cat = CATEGORIES.find(c => c.id === state.currentCategory);
  app.innerHTML = `
    <div class="screen">
      <div class="quiz-wrap">
        <div class="stimulus">🏆</div>
        <h2 style="font-size:3vw;color:var(--primary-deep)">${esc(t('finished')(catLabel(cat)))}</h2>
        <div class="choice-row">
          <button class="choice-tile tile" data-focusable data-action="category" data-id="${cat.id}">
            <div class="emoji">🔁</div><div>${esc(t('replay'))}</div>
          </button>
          <button class="choice-tile tile" data-focusable data-action="home">
            <div class="emoji">🏠</div><div>${esc(t('home'))}</div>
          </button>
        </div>
      </div>
    </div>
  `;
  wireActions();
  setFocus(focusables()[0]);
}

function renderSettings(){
  const app = document.getElementById('app');
  const s = state.settings;
  app.innerHTML = `
    <div class="screen">
      <div class="top-bar">
        <button class="back-btn tile" data-focusable data-action="home">⬅️ ${esc(t('back'))}</button>
        <h2 style="font-size:2vw;">⚙️ ${esc(t('settingsTitle'))}</h2>
        <div style="width:8vw"></div>
      </div>
      <div class="settings-form">
        <div class="field">
          <label>${esc(t('childNameLabel'))}</label>
          <input type="text" id="childName" data-focusable value="${esc(s.childName)}">
        </div>
        <div class="field">
          <div class="photo-row">
            <div class="photo-preview">${avatarPic('child')}</div>
            <label class="upload-btn tile" data-focusable tabindex="0">
              📷 ${esc(t('uploadChildPhoto'))}
              <input type="file" accept="image/*" id="childPhotoInput" style="display:none">
            </label>
          </div>
        </div>
        <div class="field">
          <label>${esc(t('mammaNameLabel'))}</label>
          <input type="text" id="mammaName" data-focusable value="${esc(s.mammaName)}">
        </div>
        <div class="field">
          <div class="photo-row">
            <div class="photo-preview">${avatarPic('mamma')}</div>
            <label class="upload-btn tile" data-focusable tabindex="0">
              📷 ${esc(t('uploadMammaPhoto'))}
              <input type="file" accept="image/*" id="mammaPhotoInput" style="display:none">
            </label>
            <button class="mode-pill tile ${s.mammaEnabled?'active':''}" data-focusable data-action="toggle-mamma-player">${s.mammaEnabled?'✅':'⬜'} ${esc(t('playsInChallenge'))}</button>
          </div>
        </div>
        <div class="field">
          <label>${esc(t('papaNameLabel'))}</label>
          <input type="text" id="papaName" data-focusable value="${esc(s.papaName)}">
        </div>
        <div class="field">
          <div class="photo-row">
            <div class="photo-preview">${avatarPic('papa')}</div>
            <label class="upload-btn tile" data-focusable tabindex="0">
              📷 ${esc(t('uploadPapaPhoto'))}
              <input type="file" accept="image/*" id="papaPhotoInput" style="display:none">
            </label>
            <button class="mode-pill tile ${s.papaEnabled?'active':''}" data-focusable data-action="toggle-papa-player">${s.papaEnabled?'✅':'⬜'} ${esc(t('playsInChallenge'))}</button>
          </div>
        </div>
        <div class="field">
          <label>${esc(t('startModeLabel'))}</label>
          <div class="choice-row">
            <button class="choice-tile tile" data-focusable data-action="mode" data-mode="choice" style="${s.forcedMode==='choice'?'box-shadow:0 0 0 4px var(--focus-ring), var(--shadow)':''}">
              <div class="emoji">👆</div><div>${esc(t('modeChoice'))}</div>
            </button>
            <button class="choice-tile tile" data-focusable data-action="mode" data-mode="voice" style="${s.forcedMode==='voice'?'box-shadow:0 0 0 4px var(--focus-ring), var(--shadow)':''}">
              <div class="emoji">🎤</div><div>${esc(t('modeVoice'))}</div>
            </button>
          </div>
          <div class="mic-status" style="margin-top:1vh">
            ${esc(t('modeHint'))}<br>
            ${esc(voiceSupported ? t('micAvailable') : t('micUnavailable'))}
          </div>
        </div>
        <div class="field">
          <button class="pill-btn tile" data-focusable data-action="reset-stars" style="background:var(--ink-soft)">${esc(t('resetStars'))}</button>
        </div>
      </div>
    </div>
  `;
  wireActions();

  document.getElementById('childName').addEventListener('change', e => { state.settings.childName = e.target.value || 'Valeria'; saveSettings(); });
  document.getElementById('mammaName').addEventListener('change', e => { state.settings.mammaName = e.target.value || 'Mamma'; saveSettings(); });
  document.getElementById('papaName').addEventListener('change', e => { state.settings.papaName = e.target.value || 'Papà'; saveSettings(); });
  document.getElementById('childPhotoInput').addEventListener('change', e => handlePhoto(e, 'childPhoto'));
  document.getElementById('mammaPhotoInput').addEventListener('change', e => handlePhoto(e, 'mammaPhoto'));
  document.getElementById('papaPhotoInput').addEventListener('change', e => handlePhoto(e, 'papaPhoto'));

  setFocus(focusables()[0]);
}

function handlePhoto(e, key){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const size = 200;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      state.settings[key] = canvas.toDataURL('image/jpeg', 0.8);
      saveSettings();
      renderSettings();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ================= ACTIONS ================= */
function wireActions(){
  document.querySelectorAll('[data-action]').forEach(el => {
    el.onclick = (e) => { window.__lastClickTrusted = e.isTrusted; handleAction(el.dataset); };
  });
}

function handleAction(data){
  switch(data.action){
    case 'settings': goto('settings'); break;
    case 'home': state.screen = 'home'; state.history = []; render(); break;
    case 'back': goBack(); break;
    case 'category': renderCategoryStart(data.id); break;
    case 'toggle-challenge':
      state.settings.challengeMode = !state.settings.challengeMode;
      state.scores = {child:0, mamma:0, papa:0}; state.turn = 'child';
      saveSettings(); render(); break;
    case 'toggle-mamma-player':
      state.settings.mammaEnabled = !state.settings.mammaEnabled;
      saveSettings(); renderSettings(); break;
    case 'toggle-papa-player':
      state.settings.papaEnabled = !state.settings.papaEnabled;
      saveSettings(); renderSettings(); break;
    case 'mode':
      state.settings.forcedMode = data.mode; saveSettings(); renderSettings(); break;
    case 'reset-stars':
      state.stars = {}; saveStars(); renderSettings(); break;
    case 'set-lang':
      state.settings.lang = data.lang; saveSettings(); applyDocumentLang(); render(); break;
    case 'set-mode': {
      if(data.mode === 'voice' && !voiceSupported){
        speak(t('micUnavailableToast'));
        break;
      }
      state.quizMode = data.mode;
      state.voiceFails = 0;
      state.showChoiceFallback = false;
      render();
      break;
    }
    case 'listen-word': {
      const cat = CATEGORIES.find(c => c.id === state.currentCategory);
      const item = resolveItem(cat.items[state.order[state.currentIndex]]);
      const langOverride = cat.id === 'lettere' ? 'it-IT' : undefined;
      speak(phrase(item), {teach:true, langOverride});
      break;
    }
    case 'try-voice': {
      if(state.listening) break;
      const cat = CATEGORIES.find(c => c.id === state.currentCategory);
      const item = resolveItem(cat.items[state.order[state.currentIndex]]);
      const langOverride = cat.id === 'lettere' ? 'it-IT' : undefined;
      startListening(item, (ok, err) => {
        if(ok){
          celebrate(() => nextItem(true));
        } else {
          state.voiceFails++;
          if(state.voiceFails >= 2){
            state.showChoiceFallback = true;
            render();
          } else {
            playSoftBlip();
            const retryList = RETRY();
            speak(retryList[Math.floor(Math.random()*retryList.length)]);
            render();
          }
        }
      }, langOverride);
      break;
    }
    case 'choice': {
      if(state.answering) break;
      const cat = CATEGORIES.find(c => c.id === state.currentCategory);
      const item = resolveItem(cat.items[state.order[state.currentIndex]]);
      if(normalize(data.word) === normalize(item.w)){
        state.answering = true;
        const langOverride = cat.id === 'lettere' ? 'it-IT' : undefined;
        speak(phrase(item), {teach:true, langOverride, onEnd: () => celebrate(() => nextItem(true))});
      } else {
        playSoftBlip();
        speak(RETRY()[0]);
      }
      break;
    }
  }
}

/* ================= UTIL ================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function phrase(item){
  if(!item.art) return cap(item.w);
  const artCap = cap(item.art);
  const sep = item.art.endsWith("'") ? '' : ' ';
  return `${artCap}${sep}${item.w}`;
}

/* ================= MAIN RENDER ================= */
function render(){
  if(state.screen === 'home') renderHome();
  else if(state.screen === 'quiz') renderQuiz();
  else if(state.screen === 'category-done') renderCategoryDone();
  else if(state.screen === 'settings') renderSettings();
}

render();
</script>
